instructions: '# Translation error annotation


  ## Prerequisite


  Please familiarise yourself with the [Multidimensional Quality Metrics (MQM) Core
  Typology](https://www.themqm.org/mqm-pillars/the-mqm-core-typology/). Familiarity
  with this typology is **essential** to perform the annotation task. When you are
  ready, please continue.


  ## Task instructions


  You will be shown a warning message in English and its translation in your language,
  i.e. a hit. For each hit, your task is to:


  1. **identify** any errors in the translation;

  1. for each error, **highlight** text span(s) that correspond to the error; and

  1. **rate** the severity of the error.


  ### Identifying errors


  If you spot an error with the translation, click "Add Edit". You will then be shown
  a bunch of error types adapted from the MQM typology. Select the appropriate type
  for the error you''ve identified.


  ### Highlighting spans


  Once you selected the error type, highlight the erroneous text span in the translation
  and, for most error types, the corresponding text span in the English message. There
  are two exceptions to this. First, error type "Accuracy - Omission" requires you
  to highlight only the text span in the English message that is omitted in the translation.
  Second, error type "Accuracy - Addition" requires you to highlight only the text
  span in the translation that doesn''t exist in the English message.


  A few things to note:


  1. You cannot highlight words that are part of a text span that is already highlighted
  (e.g., for another error type). Put simply, highlights cannot overlap. If this happens,
  keep only the error type that you think is more severe.

  1. Error type "Design and markup" allows you to highlight multiple, disjoint text
  spans. This means that you can highlight, say, only the tags `<p>` and `</p>` in
  "`<p>` foo bar `</p>`" without including the words "foo bar".

  1. Highlighting may not work on Firefox. If this issue affects you, please use a
  different browser.


  Click "Save" once you finished highlighting.


  ### Rating severity


  Click the pencil icon corresponding to the error in the list of "EDIT ANNOTATIONS".
  You will be shown a bunch of error subtypes again adapted from the MQM typology.
  Select the appropriate subtype for the error, then rate its severity. To decide
  the right severity level, it may be helpful to know that emergency warnings are
  intended to (a) *inform* the community of an impending or current threat and/or
  (2) *promote* appropriate responsive actions. The definition of each severity level
  is as follows:


  1. **minor**: differs from your preferred translation but is an acceptable translation

  1. **somewhat**: does not seriously impede the usability, understandability, or
  reliability of the content for its intended purpose, but has a limited impact on,
  for example, accuracy, stylistic quality, consistency, fluency, clarity, or general
  appeal of the content

  1. **a lot**: seriously affects the understandability, reliability, or usability
  of the content for its intended purpose


  Note that you can only select one error subtype. If multiple subtypes apply, select
  the most severe one in your opinion. Click "Save" once you finished rating.


  ## Saving and resuming your work


  Your work will **NOT** be saved automatically. You must **save your work yourself**
  by downloading your annotations by clicking the downward arrow icon on the top-right
  corner. Failure to do so may risk **losing all of your annotations**. Your annotations
  will be downloaded as a single JSON file. You can then close your browser window
  and resume the task another time.


  To continue where you left off, open the annotation page and upload your annotation
  data that you downloaded in the previous step by clicking the upward arrow on the
  top-right corner. You can then proceed with the annotation task as normal.


  ## Finishing the task


  Once you annotated all hits, download your annotation data and send it to Kemal
  via [kemal.kurniawan@unsw.edu.au](mailto:kemal.kurniawan@unsw.edu.au) or Teams.

  '
